name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Dummy value: these checks never connect to a database.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      # Next.js writes its LayoutProps/PageProps types during a build; a fresh
      # machine has none, so generate them before type-checking.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint
      - run: npm test
